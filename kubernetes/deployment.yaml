# The same container Phase 9 publishes to GHCR (public, no pull secret
# needed - see Phase 11's notes on making the package public) - not a
# separate build for Kubernetes. 2 replicas so the Service actually
# balances across something, and so the HPA (hpa.yaml) has room to scale
# within.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow
  namespace: devflow
  labels:
    app: devflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devflow
  template:
    metadata:
      labels:
        app: devflow
    spec:
      containers:
        - name: devflow
          image: ghcr.io/mrmlaba/devflow:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devflow-config
            - secretRef:
                name: devflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Deliberately the same liveness check Phase 6 built for
          # Docker's own HEALTHCHECK - "is the process up," not "can it
          # reach Supabase," so a transient Supabase blip doesn't get
          # read as this pod being unhealthy and restarted for no reason.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
