# Reference only, same reasoning as kubernetes/secret.example.yaml.
# Grafana itself is only reachable via `kubectl port-forward` (see
# README.md) - not on the public Ingress - but the admin password still
# shouldn't be the "admin/admin" default sitting in a committed file.
#
#   kubectl create secret generic grafana-secrets -n monitoring \
#     --from-literal=admin-password=$(openssl rand -hex 16)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
type: Opaque
stringData:
  admin-password: "your-grafana-admin-password"
