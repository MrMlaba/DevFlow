# Reference only, same reasoning as kubernetes/secret.example.yaml -
# create the real one imperatively, using the exact same value as
# devflow-secrets' METRICS_TOKEN (Prometheus presents this back to the
# app's /api/metrics as a bearer token, so the two must match):
#
#   kubectl create secret generic prometheus-secrets -n monitoring \
#     --from-literal=metrics-token=<same value as devflow-secrets METRICS_TOKEN>
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-secrets
  namespace: monitoring
type: Opaque
stringData:
  metrics-token: "your-metrics-token"
