# Reference only - shows the Secret's shape. Never fill this in and
# apply it directly (a real Secret in a plain YAML file risks getting
# committed). Create the real one imperatively instead, straight from
# .env.local:
#
#   kubectl create secret generic devflow-secrets -n devflow \
#     --from-literal=NEXT_PUBLIC_SUPABASE_URL=... \
#     --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_ID=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_SECRET=...
#
# See docs/development.md (Phase 13) for the exact command reading these
# straight out of .env.local.
apiVersion: v1
kind: Secret
metadata:
  name: devflow-secrets
  namespace: devflow
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "your-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
  GITHUB_OAUTH_CLIENT_ID: "your-github-oauth-client-id"
  GITHUB_OAUTH_CLIENT_SECRET: "your-github-oauth-client-secret"
