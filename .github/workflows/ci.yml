name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR when a new commit
# lands, so pushes during review don't queue up stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 22, not 20: @supabase/supabase-js's realtime-js unconditionally
# initializes a RealtimeClient in the SupabaseClient constructor (every
# createClient() call, not just actual realtime usage), which requires a
# native `WebSocket` global - only present in Node 22+. On Node 20 this
# throws "Node.js detected but native WebSocket not found" the instant
# any code creates a Supabase client. Found when the e2e job's db:seed
# step crashed on this workflow's original node-version: 20.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig.json's `include` covers .next/types/**/*.ts (Next's
      # route-aware PageProps/LayoutProps/RouteContext helpers - see
      # AGENTS.md and layout.tsx/login/page.tsx) - those don't exist until
      # something generates them. `next build` does that as a side effect
      # (which is why the build job doesn't need this), but a standalone
      # `tsc --noEmit` in its own job doesn't run the app at all.
      # `next typegen` generates just the types, without a full build.
      - run: npx next typegen
      - run: npm run type-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No Supabase/GitHub secrets needed here: nothing in this app reads
      # them during static generation or from a Client Component (verified
      # in Phase 6 - see docs/devops-roadmap.md) - `next build` succeeds
      # on its own.
      - run: npm run build

  # Only on push to main, not every PR: this suite logs in as the seeded
  # demo accounts and creates real projects/tasks in the same live
  # Supabase project `npm run dev` uses (DevFlow has no separate test
  # environment yet - see docs/devops-roadmap.md, Phase 7). Needs
  # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
  # SUPABASE_SERVICE_ROLE_KEY, and SEED_USER_PASSWORD set as repository
  # secrets (Settings -> Secrets and variables -> Actions).
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
