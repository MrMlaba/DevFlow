# Deploys to Vercel on every push to main. Two jobs, two GitHub
# Environments: `staging` deploys automatically (a Vercel Preview
# deployment - see docs/devops-roadmap.md, Phase 10, for why Preview
# rather than a paid Custom Environment); `production` deploys for real
# (`vercel deploy --prod`) but only after a human approves it in GitHub's
# UI - that approval is configured once, on the repo, at Settings ->
# Environments -> production -> Required reviewers. Referencing an
# `environment:` on a job is what makes GitHub record a real Deployment
# (visible via the repo's Environments UI and the Deployments API) and
# what makes the required-reviewer rule actually pause the job.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel@59.3.0
      # `vercel deploy`'s stdout shape isn't consistent across platforms:
      # it printed a bare URL on GitHub's Linux runner (matching Vercel's
      # own docs) but a JSON result object when the exact same
      # non-interactive invocation was tested on Windows first - so
      # "verified locally" turned out not to be a reliable stand-in for
      # "verified on the actual CI platform." Handles both rather than
      # assume either: JSON only if the output actually starts with `{`.
      - id: deploy
        run: |
          OUTPUT=$(vercel deploy --yes)
          if [[ "$OUTPUT" == "{"* ]]; then
            URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).deployment.url)" <<< "$OUTPUT")
          else
            URL="$OUTPUT"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel@59.3.0
      - id: deploy
        run: |
          OUTPUT=$(vercel deploy --prod --yes)
          if [[ "$OUTPUT" == "{"* ]]; then
            URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).deployment.url)" <<< "$OUTPUT")
          else
            URL="$OUTPUT"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
